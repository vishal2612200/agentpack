# Per-language ranking-quality thresholds for the continuous benchmark suite.
#
# Each test in tests/benchmarks/test_lang_*.py runs the AgentPack public
# benchmark harness on the named repo, then asserts that the aggregate
# metrics meet the mins below. To lock in an improvement, raise the min.
#
# Baseline metrics (as of the tree-sitter Phase 1 shipment) are the numbers
# recorded in benchmarks/results/tree-sitter-comparison.md and the control
# runs under benchmarks/results/control/. Thresholds are set 1-2 pp below
# those numbers so sampling noise on rerun does not spuriously fail CI.
#
# Fields per language:
#   repo                       — must match a name in benchmarks/public-repos.toml
#   min_recall                 — avg recall across the sampled cases (0-1)
#   min_token_precision        — avg token precision (0-1)
#   min_reason_graph_precision — share of files selected via import-graph signal
#                                that were expected. 0.0 = signal effectively dark.
#   min_reason_content_precision — same, for content-keyword signal (drives from
#                                symbols entering the keyword pool)
#   max_median_wall_seconds    — per-case wall time budget guard
#   min_cases                  — must run at least this many cases; guards against
#                                sampling collapse (e.g. all commits filtered out)

[php]
repo = "laravel-framework"
# Observed (two runs, sample_history=15): recall 16.7/16.7, tp 8.4/7.8,
# reason_graph 7.1/5.6, reason_content 8.2/7.8. Thresholds set ~2 pp below
# the lower of the two to give sampling headroom. Raise these as the PHP
# query and PSR-4 resolution improve.
min_recall = 0.14
min_token_precision = 0.06
min_reason_graph_precision = 0.03
min_reason_content_precision = 0.05
max_median_wall_seconds = 30.0
min_cases = 10

