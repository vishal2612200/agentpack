[java]
repo = "spring-petclinic"
# spring-boot was tried first but rejected: its `main` mainline is
# dominated by "Merge branch '4.0.x'" merge commits (a dual-branch
# maintenance workflow), so --first-parent --no-merges sampling yields
# ~5% java-touching commits regardless of clone depth. spring-petclinic
# has a simple linear history and was already in the pre-tree-sitter
# suite.
# Observed (two identical runs, sample_history=20, tree-sitter Phase 1
# active): 20 cases, recall 61.7%, tp 28.5%, reason_graph 31.4%,
# reason_content 33.5%, reason_symbol 0.0%. Thresholds set ~2 pp below.
min_recall = 0.58
min_token_precision = 0.25
min_reason_graph_precision = 0.28
min_reason_content_precision = 0.30
max_median_wall_seconds = 5.0
min_cases = 15

[ruby]
repo = "rails"
# Observed (two identical runs, sample_history=15, tree-sitter Phase 1
# active): 15 cases, recall 13.3%, tp 3.0%, reason_graph 1.4%,
# reason_content 3.0%. Numbers are genuinely low — inspected a
# zero-recall case and found candidate_recall_at_100=0.0 (expected file
# ranked #1176 of thousands; Rails is a huge monorepo spanning
# activesupport/activerecord/actionpack/etc, and single-file low-context
# commit subjects are a hard case for keyword-based ranking regardless
# of language). This is real difficulty, not a config bug. Thresholds
# set ~2 pp below observed; Phase 2 (import resolution, since
# require_relative is already resolved for Ruby) and Phase 4 (call-graph)
# are the levers expected to move this.
min_recall = 0.11
min_token_precision = 0.02
min_reason_graph_precision = 0.01
min_reason_content_precision = 0.02
max_median_wall_seconds = 20.0
min_cases = 10

[terraform]
