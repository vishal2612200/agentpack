# terraform.scm header), so reason_graph is driven entirely by test-pairing,
# not tree-sitter edges. Thresholds set ~2pp below observed.
min_recall = 0.22
min_token_precision = 0.13
min_reason_graph_precision = 0.04
min_reason_content_precision = 0.14
max_median_wall_seconds = 10.0
