# ---------------------------------------------------------------------------
# Languages added to measure the tree-sitter symbol/import backend.
# Ruby and PHP get no structural analysis today (regex extractors return []),
# so the baseline recall floor is the "filename + content-token only" signal.
# Java has spring-petclinic above; spring-boot exercises more idioms.
# History depth kept modest on the giants (rails, laravel, symfony) so total
# benchmark runtime stays reasonable.
# ---------------------------------------------------------------------------

[[repos]]
name = "spring-boot"
url = "https://github.com/spring-projects/spring-boot.git"
ref = "main"
sample_history = 40
task_type = "java-spring"
mode = "balanced"
budget = 4000
# spring-boot 4.x restructured away from the old spring-boot-project/ layout;
# java now lives under core/, module/, starter/, smoke-test/, etc.
include_globs = [
  "core/**/*.java",
  "module/**/*.java",
  "starter/**/*.java",
  "loader/**/*.java",
  "test-support/**/*.java",
]
exclude_globs = [
  "**/build/**",
  "smoke-test/**",
  "**/src/*Test/resources/**",
]
max_changed_files = 8

