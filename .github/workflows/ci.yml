name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --cov --cov-report=term-missing -m "not slow"
      - name: Lint
        run: ruff check src/ tests/
      - name: Type check
        run: mypy

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - name: Test npm wrapper
        run: npm test --prefix npm
      - name: Smoke npm package dry run
        run: |
          AGENTPACK_NPM_DRY_RUN=1 node npm/bin/agentpack.js --version
          cd npm
          npm pack --dry-run

  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - name: Install dashboard dependencies
        run: |
          pip install -e ".[dev]" playwright
          npm ci --prefix frontend/dashboard
          python -m playwright install --with-deps chromium
      - name: Verify generated contracts and build dashboard
        run: |
          npm run check:contracts --prefix frontend/dashboard
          npm run typecheck --prefix frontend/dashboard
          npm run build --prefix frontend/dashboard
      - name: Run dashboard browser tests
        run: pytest tests/test_dashboard_browser_smoke.py tests/test_dashboard_semantic_browser.py -q

  agent-integration-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Verify all agent integrations
        run: pytest tests/test_agent_integration_matrix.py -q

  tree-sitter-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Install tree-sitter floor
        run: pip install -e ".[dev,tree-sitter]" "tree-sitter==0.23.2" "tree-sitter-language-pack==0.7.4"
      - name: Run tree-sitter backend tests
        run: pytest tests/test_tree_sitter_backend.py -q
