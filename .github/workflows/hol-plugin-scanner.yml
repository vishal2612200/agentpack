name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@c9670633bef3f7697c35f03137d20edff83ba783
        with:
          plugin_dir: "src/agentpack/data/codex_plugin"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
