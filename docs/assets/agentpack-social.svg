<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" role="img" viewBox="0 0 1200 630"><title id="title">AgentPack social preview</title><desc id="desc">AgentPack visual summary showing ranked repo context, skill recommendations, review preflight, learning capture, advisory memory, and source-first validation.</desc><rect width="1200" height="630" fill="#0f172a"/><rect width="1072" height="502" x="64" y="64" fill="#111827" stroke="#273449" stroke-width="2" rx="28"/><g transform="translate(92 92) scale(.34)"><rect width="512" height="512" fill="#0F172A" rx="96"/><path fill="#1F6FEB" d="M128 142h176c44 0 80 36 80 80v148H208c-44 0-80-36-80-80V142Z"/><path fill="#22C55E" d="M178 112h176c44 0 80 36 80 80v148H258c-44 0-80-36-80-80V112Z"/><path fill="#F8FAFC" d="M154 196h204c20 0 36 16 36 36v104H190c-20 0-36-16-36-36V196Z"/><path stroke="#0F172A" stroke-linecap="round" stroke-width="24" d="M206 246h152"/><path stroke="#0F172A" stroke-linecap="round" stroke-width="24" d="M206 296h104"/></g><text x="302" y="150" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="62" font-weight="700">AgentPack</text><text x="304" y="208" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="29">Ranked repo context for AI coding agents</text><g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="23"><rect width="780" height="264" x="302" y="258" fill="#0b1220" stroke="#273449" rx="16"/><text x="334" y="304" fill="#60a5fa">$ agentpack route --task &quot;fix billing retry&quot;</text><text x="334" y="346" fill="#e5e7eb">selected files + reasons + focused tests</text><text x="334" y="388" fill="#60a5fa">Skill recommendations: review, debugging, tests</text><text x="334" y="430" fill="#60a5fa">$ agentpack review --check --dry-run-post</text><text x="334" y="472" fill="#60a5fa">$ agentpack learn &quot;retry ordering + idempotency&quot;</text><text x="334" y="514" fill="#34d399">$ agentpack memory --timeline: timestamps + confidence</text></g><text x="92" y="548" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23">Local first. No cloud index. Advisory signals; live source, tests, and PR review stay authority.</text></svg>