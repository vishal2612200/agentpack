<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title description">
  <title id="title">GitHub Actions dependency refresh: before and after</title>
  <desc id="description">Workflow triggers, jobs, and outputs stay the same. Pinned checkout and PyPI publish actions change, and generated CI templates advance from the movable checkout v4 tag to v7.</desc>
  <rect width="1200" height="590" fill="#ffffff"/>
  <text x="35" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">GitHub Actions dependency refresh</text>
  <text x="35" y="70" font-family="Arial, sans-serif" font-size="17" fill="#334155">Eight repository workflows and generated CI templates; triggers, jobs, and outputs stay unchanged.</text>

  <rect x="30" y="95" width="1140" height="210" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="50" y="132" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#9a3412">Before · current main</text>
  <rect x="50" y="158" width="235" height="105" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="191" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">PR, push, or release tag</text>
  <text x="66" y="221" font-family="Arial, sans-serif" font-size="16" fill="#334155">Existing triggers</text>
  <line x1="285" y1="210" x2="345" y2="210" stroke="#475569" stroke-width="3"/>
  <path d="M345 204 L357 210 L345 216 Z" fill="#475569"/>
  <rect x="365" y="158" width="440" height="105" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="381" y="187" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">GitHub-hosted workflow jobs</text>
  <text x="381" y="215" font-family="Arial, sans-serif" font-size="16" fill="#334155">checkout: pinned 4.x · templates @v4</text>
  <text x="381" y="240" font-family="Arial, sans-serif" font-size="16" fill="#334155">PyPI publish@1.14.0 · release workflow</text>
  <line x1="805" y1="210" x2="855" y2="210" stroke="#475569" stroke-width="3"/>
  <path d="M855 204 L867 210 L855 216 Z" fill="#475569"/>
  <rect x="875" y="158" width="275" height="105" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="891" y="191" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Existing outputs</text>
  <text x="891" y="221" font-family="Arial, sans-serif" font-size="16" fill="#334155">Checks, docs, packages</text>

  <rect x="30" y="330" width="1140" height="210" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="50" y="367" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#166534">After · proposed PR</text>
  <rect x="50" y="393" width="235" height="105" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="426" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">PR, push, or release tag</text>
  <text x="66" y="456" font-family="Arial, sans-serif" font-size="16" fill="#334155">Existing triggers</text>
  <line x1="285" y1="445" x2="345" y2="445" stroke="#475569" stroke-width="3"/>
  <path d="M345 439 L357 445 L345 451 Z" fill="#475569"/>
  <rect x="365" y="393" width="440" height="105" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="381" y="422" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">GitHub-hosted workflow jobs</text>
  <text x="381" y="450" font-family="Arial, sans-serif" font-size="16" fill="#166534">checkout: pinned 7.0.1 · templates @v7</text>
  <text x="381" y="475" font-family="Arial, sans-serif" font-size="16" fill="#166534">PyPI publish@1.14.2 · release workflow</text>
  <line x1="805" y1="445" x2="855" y2="445" stroke="#475569" stroke-width="3"/>
  <path d="M855 439 L867 445 L855 451 Z" fill="#475569"/>
  <rect x="875" y="393" width="275" height="105" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="891" y="426" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Existing outputs</text>
  <text x="891" y="456" font-family="Arial, sans-serif" font-size="16" fill="#334155">Checks, docs, packages</text>
</svg>
